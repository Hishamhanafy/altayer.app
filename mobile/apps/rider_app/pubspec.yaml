name: rider_app
description: "3altayer Rider Mobile Application - Hybrid Ride Hailing (Instant & Bidding)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  socket_io_client: ^2.0.3+1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.4
  intl: ^0.20.3
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
