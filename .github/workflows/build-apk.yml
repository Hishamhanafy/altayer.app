name: Build 3altayer Android APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      # 1. Build Rider App APK
      - name: Install Rider App Dependencies
        working-directory: mobile/apps/rider_app
        run: flutter pub get

      - name: Build Rider App APK
        working-directory: mobile/apps/rider_app
        run: flutter build apk --release

      # 2. Build Driver App APK
      - name: Install Driver App Dependencies
        working-directory: mobile/apps/driver_app
        run: flutter pub get

      - name: Build Driver App APK
        working-directory: mobile/apps/driver_app
        run: flutter build apk --release

      # 3. Upload APK Artifacts
      - name: Upload Rider App APK
        uses: actions/upload-artifact@v4
        with:
          name: 3altayer-rider-release-apk
          path: mobile/apps/rider_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: 3altayer-driver-release-apk
          path: mobile/apps/driver_app/build/app/outputs/flutter-apk/app-release.apk
