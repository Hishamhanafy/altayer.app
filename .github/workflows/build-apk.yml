name: Build 3altayer Android APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK Tools, NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0" "platforms;android-34" "platforms;android-35" "platforms;android-36" "ndk;28.2.13676358"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      # 1. Build Rider App APK
      - name: Install Rider App Dependencies
        working-directory: mobile/apps/rider_app
        run: flutter pub get

      - name: Build Rider App APK
        working-directory: mobile/apps/rider_app
        run: flutter build apk --release --no-tree-shake-icons

      # 2. Build Driver App APK
      - name: Install Driver App Dependencies
        working-directory: mobile/apps/driver_app
        run: flutter pub get

      - name: Build Driver App APK
        working-directory: mobile/apps/driver_app
        run: flutter build apk --release --no-tree-shake-icons

      # 3. Rename and Prepare APKs
      - name: Prepare APKs
        run: |
          mkdir -p output_apks
          cp mobile/apps/rider_app/build/app/outputs/flutter-apk/app-release.apk output_apks/akhil-rider-app.apk
          cp mobile/apps/driver_app/build/app/outputs/flutter-apk/app-release.apk output_apks/akhil-driver-app.apk

      # 4. Upload APK Artifacts
      - name: Upload Rider App APK
        uses: actions/upload-artifact@v4
        with:
          name: akhil-rider-release-apk
          path: output_apks/akhil-rider-app.apk

      - name: Upload Driver App APK
        uses: actions/upload-artifact@v4
        with:
          name: akhil-driver-release-apk
          path: output_apks/akhil-driver-app.apk

      # 5. Create / Update GitHub Release with Direct APK Download Links
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apks
          name: "AKHIL Android Release APKs (Latest)"
          body: |
            ## 🐎 أخيل - AKHIL Smart Transportation Mobile APKs
            Updated build compiled directly via GitHub Actions cloud runner.

            ### 📱 Download Links:
            - **[akhil-rider-app.apk](https://github.com/Hishamhanafy/altayer.app/releases/download/latest-apks/akhil-rider-app.apk)** (Rider App)
            - **[akhil-driver-app.apk](https://github.com/Hishamhanafy/altayer.app/releases/download/latest-apks/akhil-driver-app.apk)** (Driver / Captain App)

            ### ✨ Key Features Included:
            - 📸 Live Camera KYC & Biometric Face Verification
            - 📍 Dynamic Pickup & Destination selector in Cairo & Giza
            - ⚡ Instant InstaPay Payouts & Wallet Top-up
            - 🗺️ Multi-layer Interactive Maps
          files: |
            output_apks/akhil-rider-app.apk
            output_apks/akhil-driver-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
